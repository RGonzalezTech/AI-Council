[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council"
version = "0.1.0"
description = "AI-driven multi-agent debate CLI for stress-testing ideas"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "InquirerPy>=0.3.4",
    "pydantic>=2.0",
    "litellm>=1.40",
    "instructor>=1.3",
    "python-dotenv>=1.0",
]

[project.scripts]
council = "council.cli:app"

[tool.setuptools.packages.find]
include = ["council*"]
